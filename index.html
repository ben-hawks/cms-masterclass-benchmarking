<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="CMS masterclass, 26 October 2026: AI/ML benchmarking for science. Interactive talk by Ben Hawks (Fermilab).">
<title>Masterclass: AI/ML Benchmarking</title>
<!-- Design and scene engine adapted from Andrzej Novak's CMS masterclass talk, github.com/jfc-mit/jfc-talk (itself after the hcc-kappac Florence talk and danielmurnane.com). Content: B. Hawks et al., arXiv:2511.05614. Credits slide: #b-credits. -->
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&display=swap">
<style>
/* Layout: a fixed 1600x900 scene canvas, scaled to fit between a mono crumb band (top) and a progress band (bottom),
   the same chrome and paper treatment as the CMS masterclass jfc-talk cut. */
:root {
  --serif: "EB Garamond", Georgia, "Times New Roman", serif;
  --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  --bg: #f6f1e7; --bg2: #efe8d9; --ink: #1c1712; --ink60: rgba(28,23,18,.60); --ink40: rgba(28,23,18,.42);
  --ink12: rgba(28,23,18,.12); --card: #fffdf8; --accent: #8a1f1f; --chip: rgba(28,23,18,.06);
  --blue: #1f5fb4; --green: #1a7a1a; --tipbg: #1c1712; --tipfg: #f6f1e7;
  --shadow: 0 2px 6px rgba(60,45,30,.10), 0 12px 34px rgba(60,45,30,.13); --logo: none;
  --band: 46px;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #07080a; --bg2: #0c0e12; --ink: #ece8e0; --ink60: rgba(236,232,224,.62); --ink40: rgba(236,232,224,.44);
  --ink12: rgba(236,232,224,.14); --card: #14161a; --accent: #e4a23c; --chip: rgba(236,232,224,.07);
  --blue: #6aa2ea; --green: #59b45a; --tipbg: #ece8e0; --tipfg: #07080a;
  --shadow: 0 2px 8px rgba(0,0,0,.5), 0 14px 40px rgba(0,0,0,.55); --logo: invert(1); color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #07080a; --bg2: #0c0e12; --ink: #ece8e0; --ink60: rgba(236,232,224,.62); --ink40: rgba(236,232,224,.44);
  --ink12: rgba(236,232,224,.14); --card: #14161a; --accent: #e4a23c; --chip: rgba(236,232,224,.07);
  --blue: #6aa2ea; --green: #59b45a; --tipbg: #ece8e0; --tipfg: #07080a;
  --shadow: 0 2px 8px rgba(0,0,0,.5), 0 14px 40px rgba(0,0,0,.55); --logo: invert(1); color-scheme: dark; }

* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; }
body { background: radial-gradient(120% 100% at 50% 0%, var(--bg2), var(--bg) 60%) fixed, var(--bg); color: var(--ink);
  font-family: var(--sans); overflow: hidden; user-select: none; -webkit-user-select: none;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
a { color: inherit; }
:where(button, a, input, [tabindex="0"]):focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

/* ------------------------------------------------ stage */
#viewport { position: fixed; left: 0; right: 0; top: calc(var(--band) + env(safe-area-inset-top, 0px)); bottom: calc(var(--band) + env(safe-area-inset-bottom, 0px)); cursor: pointer; }
#stage { position: absolute; left: 50%; top: 50%; width: 1600px; height: 900px; transform-origin: 50% 50%; }
.scene { position: absolute; inset: 0; padding: 40px 80px 30px; display: none; flex-direction: column; }
.scene.on { display: flex; animation: scenein 600ms cubic-bezier(.22,.8,.3,1); }
@keyframes scenein { from { opacity: 0; transform: translateY(12px) scale(.994); } to { opacity: 1; transform: none; } }
[data-step] { opacity: 0; transform: translateY(10px); transition: opacity 500ms ease, transform 500ms cubic-bezier(.22,.8,.3,1); pointer-events: none; }
[data-step].shown { opacity: 1; transform: none; pointer-events: auto; }
body.static [data-step] { opacity: 1; transform: none; }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration: .01ms !important; transition-duration: .01ms !important; } }

/* ------------------------------------------------ type */
h1 { font-family: var(--serif); font-weight: 500; font-size: 64px; line-height: 1.06; letter-spacing: -.01em; text-wrap: balance; }
h2.k { font-family: var(--serif); font-weight: 500; font-size: 44px; line-height: 1.1; letter-spacing: -.005em; margin: 14px 0 30px; text-wrap: balance; }
h1 em, h2.k em, .em { font-style: italic; color: var(--accent); }
.rule { width: 70px; height: 2px; background: var(--accent); margin: 14px 0 24px; opacity: .85; }
.lead { font-size: 23px; color: var(--ink60); line-height: 1.5; text-wrap: pretty; }
ul.t { list-style: none; font-size: 25px; line-height: 1.42; }
ul.t > li { margin: 0 0 22px; padding-left: 28px; position: relative; text-wrap: pretty; }
ul.t > li::before { content: "•"; position: absolute; left: 5px; color: var(--accent); }
ul.t li small { display: block; color: var(--ink60); font-size: 19px; margin-top: 4px; line-height: 1.4; }
ul.t.sm { font-size: 23px; } ul.t.sm > li { margin-bottom: 18px; } ul.t.sm li small { font-size: 18px; }
strong, b { font-weight: 650; }
.hl { color: var(--accent); font-weight: 600; }
.mono { font-family: var(--mono); }
.muted { color: var(--ink60); } .faint { color: var(--ink40); }
.cap { font-family: var(--mono); font-size: 14px; color: var(--ink40); text-align: center; margin-top: 10px; }
.chip { display: inline-block; font-family: var(--mono); font-size: 16px; background: var(--chip); border: 1px solid var(--ink12); border-radius: 7px; padding: 3px 10px; text-decoration: underline; text-underline-offset: 3px; text-decoration-color: var(--ink40); }
.tag { display: inline-block; font-family: var(--mono); font-size: 13px; padding: 2px 8px; border-radius: 6px; border: 1px solid var(--ink12); color: var(--ink60); background: var(--chip); }
.tag.lhc { color: var(--accent); border-color: color-mix(in srgb, var(--accent) 45%, transparent); }

/* ------------------------------------------------ layout helpers */
.cols { display: flex; gap: 48px; flex: 1; min-height: 0; align-items: center; }
.col { min-width: 0; } .grow { flex: 1; }
.fig { background: #fff; border-radius: 12px; box-shadow: var(--shadow); overflow: hidden; padding: 14px; }
.fig img { display: block; width: 100%; height: auto; }
.card { background: var(--card); border: 1px solid var(--ink12); border-radius: 10px; box-shadow: var(--shadow); padding: 18px 22px; min-width: 0; }
.card.lb { border-left: 3px solid var(--accent); }
.card .nm { font-family: var(--mono); font-weight: 700; color: var(--accent); font-size: 21px; margin-bottom: 8px; }
.card ul { list-style: none; font-size: 20px; line-height: 1.4; color: var(--ink60); }
.card ul li { padding-left: 14px; position: relative; margin-bottom: 5px; }
.card ul li::before { content: "•"; position: absolute; left: 0; color: var(--accent); }
.card .ex { margin-top: 12px; padding-top: 10px; border-top: 1px dashed var(--ink12); font-family: var(--mono); font-size: 16px; line-height: 1.4; color: var(--ink); }
.card .ex b { color: var(--accent); }
.grid { display: grid; gap: 18px; }
.statement { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; gap: 30px; }
.statement h1 { font-size: 76px; max-width: 1250px; }
.statement .lead { font-size: 28px; max-width: 1100px; color: var(--ink); opacity: .85; }
.eyebrow { font-family: var(--mono); font-size: 15px; letter-spacing: .08em; text-transform: uppercase; color: var(--ink40); }
.polaroid { background: #fff; padding: 18px 18px 46px; border-radius: 4px; box-shadow: var(--shadow); transform: rotate(-1.6deg); color: #1c1712; }
.polaroid .ptag { font-family: var(--serif); font-style: italic; text-align: center; color: #333; font-size: 21px; margin-top: 14px; }
table.tb { border-collapse: collapse; width: 100%; font-size: 19px; background: var(--card); border-radius: 10px; overflow: hidden; box-shadow: var(--shadow); }
table.tb th { font-family: var(--mono); font-weight: 600; font-size: 15px; color: var(--ink60); text-align: left; padding: 11px 14px; background: var(--chip); letter-spacing: .03em; }
table.tb td { padding: 12px 16px; border-top: 1px solid var(--ink12); vertical-align: top; line-height: 1.35; }
table.tb td small { display: block; color: var(--ink40); font-size: 14px; }
table.tb tr.me td { background: color-mix(in srgb, var(--accent) 7%, transparent); }
table.tb td.m { font-family: var(--mono); font-size: 15px; }

/* outline */
.outline { display: grid; gap: 14px; margin-top: 70px; }
.outline .row { display: flex; align-items: baseline; gap: 24px; background: var(--card); border: 1px solid var(--ink12); border-radius: 8px; padding: 20px 26px; font-size: 24px; opacity: .55; }
.outline .row .p { font-family: var(--mono); font-weight: 700; color: var(--accent); width: 116px; flex: none; }
.outline .row.on { opacity: 1; border: 2px solid var(--accent); background: color-mix(in srgb, var(--accent) 8%, var(--card)); }
.outline.all .row { opacity: 1; }

/* flow (pipeline / traditional vs AI) */
.flow { display: flex; align-items: center; gap: 12px; }
.flow .bx { background: var(--card); border: 1px solid var(--ink12); border-radius: 8px; padding: 14px 18px; font-size: 18px; text-align: center; box-shadow: var(--shadow); min-width: 0; }
.flow .bx.ai { border: 2px solid var(--accent); color: var(--accent); font-weight: 650; }
.flow .ar { color: var(--ink40); font-size: 22px; }
.flow .res { font-family: var(--mono); font-size: 17px; margin-left: 10px; white-space: nowrap; }
.flow .lab { width: 150px; font-family: var(--mono); font-size: 15px; color: var(--ink60); flex: none; }

/* heatmap */
.hm { display: grid; grid-template-columns: 250px repeat(7, 1fr); gap: 4px; font-size: 16px; }
.hm .c { height: 54px; border-radius: 5px; display: flex; align-items: center; justify-content: center; font-family: var(--mono); font-weight: 600; font-variant-numeric: tabular-nums; cursor: default; transition: transform 150ms; }
.hm .c:hover { transform: scale(1.06); }
.hm .c.hep { outline: 2px solid var(--accent); outline-offset: -1px; }
.hm .rl { display: flex; align-items: center; justify-content: flex-end; padding-right: 12px; color: var(--ink60); font-size: 16px; text-align: right; }
.hm .cl { text-align: center; color: var(--ink60); font-size: 15px; line-height: 1.2; padding-top: 8px; }
.hm .cl.hep, .hm .tot.hep { color: var(--accent); font-weight: 650; }
.hm .tot { text-align: center; font-family: var(--mono); font-size: 15px; color: var(--ink60); padding-top: 4px; }

/* tooltip */
#tip { position: fixed; z-index: 90; pointer-events: none; background: var(--tipbg); color: var(--tipfg); font-size: 14px; line-height: 1.4; padding: 8px 11px; border-radius: 7px; max-width: 340px; opacity: 0; transition: opacity 120ms; box-shadow: 0 6px 20px rgba(0,0,0,.25); }
#tip.on { opacity: 1; }
#tip b { font-weight: 650; }

/* rubric scorer */
.scorer { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; }
.scorer .cat { background: var(--card); border: 1px solid var(--ink12); border-radius: 9px; padding: 12px 14px; min-width: 0; }
.scorer .cat h4 { font-family: var(--mono); font-size: 15px; color: var(--accent); display: flex; justify-content: space-between; margin-bottom: 6px; }
.scorer .cat h4 span { color: var(--ink); font-variant-numeric: tabular-nums; }
.scorer label { display: flex; gap: 8px; align-items: flex-start; font-size: 15px; line-height: 1.3; color: var(--ink60); padding: 3px 0; cursor: pointer; }
.scorer label input { margin-top: 2px; accent-color: var(--accent); flex: none; }
.scorer label:has(input:checked) { color: var(--ink); }
.scorer .sub { font-family: var(--mono); font-size: 12px; color: var(--ink40); margin: 4px 0 1px; }
.btnrow { display: flex; gap: 10px; flex-wrap: wrap; }
.btn { font: inherit; font-family: var(--mono); font-size: 15px; padding: 8px 14px; border-radius: 8px; border: 1px solid var(--ink12); background: var(--card); color: var(--ink); cursor: pointer; }
.btn:hover { border-color: var(--accent); color: var(--accent); }
.verdict { font-family: var(--serif); font-size: 64px; font-weight: 500; font-variant-numeric: tabular-nums; line-height: 1; }
.badge { display: inline-block; font-family: var(--mono); font-size: 16px; padding: 6px 12px; border-radius: 8px; border: 1.5px solid; }
.badge.ok { color: var(--green); } .badge.no { color: var(--ink40); }

/* chrome */
#top { position: fixed; top: 0; left: 0; right: 0; height: calc(var(--band) + env(safe-area-inset-top, 0px)); padding: calc(15px + env(safe-area-inset-top, 0px)) max(20px, env(safe-area-inset-right, 0px)) 0 max(20px, env(safe-area-inset-left, 0px)); display: flex; justify-content: space-between; gap: 16px; font-family: var(--mono); font-size: 12px; color: var(--ink40); letter-spacing: .06em; pointer-events: none; z-index: 40; white-space: nowrap; }
#crumb { overflow: hidden; text-overflow: ellipsis; min-width: 0; }
#crumb .a { color: var(--accent); }
#counter { font-variant-numeric: tabular-nums; flex: none; }
#progress { position: fixed; left: 0; bottom: 0; height: 3px; background: var(--accent); width: 0; transition: width 400ms ease; z-index: 41; }
#stepsind { position: fixed; left: max(20px, env(safe-area-inset-left, 0px)); bottom: calc(14px + env(safe-area-inset-bottom, 0px)); display: flex; gap: 5px; z-index: 40; }
#stepsind span { width: 26px; height: 3px; border-radius: 2px; background: var(--ink12); }
#stepsind span.on { background: var(--accent); }
#br { position: fixed; right: max(12px, env(safe-area-inset-right, 0px)); bottom: calc(6px + env(safe-area-inset-bottom, 0px)); display: flex; gap: 6px; z-index: 42; }
#br button { font-family: var(--mono); font-size: 13px; color: var(--ink40); background: none; border: 1px solid transparent; border-radius: 8px; padding: 6px 10px; cursor: pointer; }
#br button:hover { color: var(--ink); background: var(--chip); border-color: var(--ink12); }

/* overlays */
.ov { position: fixed; inset: 0; z-index: 60; background: color-mix(in srgb, var(--bg) 94%, transparent); backdrop-filter: blur(6px); overflow: auto; padding: calc(30px + env(safe-area-inset-top, 0px)) max(24px, env(safe-area-inset-right, 0px)) calc(40px + env(safe-area-inset-bottom, 0px)) max(24px, env(safe-area-inset-left, 0px)); }
.ov h3 { font-family: var(--serif); font-weight: 500; font-size: 30px; margin: 10px 0 16px; }
.ov h3 em { color: var(--accent); }
.ovgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 12px; }
.ovcard { text-align: left; font: inherit; background: var(--card); color: var(--ink); border: 1px solid var(--ink12); border-radius: 9px; padding: 12px 14px; cursor: pointer; min-height: 92px; display: flex; flex-direction: column; gap: 6px; }
.ovcard:hover { border-color: var(--accent); }
.ovcard.cur { border: 2px solid var(--accent); }
.ovcard .n { font-family: var(--mono); font-size: 12px; color: var(--ink40); }
.ovcard .n .a { color: var(--accent); }
.ovcard .ti { font-family: var(--serif); font-size: 19px; line-height: 1.2; }
.keys { display: grid; grid-template-columns: auto 1fr; gap: 8px 22px; font-size: 16px; max-width: 640px; }
.keys kbd { font-family: var(--mono); font-size: 14px; background: var(--chip); border: 1px solid var(--ink12); border-radius: 5px; padding: 2px 7px; }
#hud { position: fixed; z-index: 55; left: max(16px, env(safe-area-inset-left, 0px)); right: max(16px, env(safe-area-inset-right, 0px)); bottom: calc(40px + env(safe-area-inset-bottom, 0px)); max-width: 900px; margin: 0 auto; background: var(--card); border: 1px solid var(--ink12); border-radius: 12px; box-shadow: var(--shadow); padding: 14px 18px; font-size: 16px; line-height: 1.5; max-height: 42vh; overflow: auto; user-select: text; -webkit-user-select: text; }
#hud .hh { display: flex; justify-content: space-between; gap: 14px; flex-wrap: wrap; font-family: var(--mono); font-size: 13px; color: var(--ink40); margin-bottom: 8px; }
#hud .hh b { color: var(--accent); }
#hud .late { color: var(--accent); }
#hud p { margin-bottom: 8px; }
.ovclose { float: right; }
.body { flex: 1; min-height: 0; display: flex; flex-direction: column; justify-content: center; }
.body > .cols { flex: 0 0 auto; }
.terms { flex: none; margin-top: 14px; padding-top: 10px; border-top: 1px solid var(--ink12); font-size: 15px; line-height: 1.4; color: var(--ink60); display: flex; flex-wrap: wrap; gap: 4px 24px; }
.terms .tl { font-family: var(--mono); font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: var(--ink40); }
.terms b { font-family: var(--mono); font-size: 14px; color: var(--accent); font-weight: 700; margin-right: 4px; }
.gloss { columns: 2; column-gap: 50px; font-size: 17px; line-height: 1.4; } .gloss div { break-inside: avoid; margin-bottom: 9px; } .gloss b { font-family: var(--mono); color: var(--accent); margin-right: 6px; }
.fig.capped img { max-height: 440px; width: auto; max-width: 100%; margin: 0 auto; }
#heptab table.tb { font-size: 16px; } #heptab table.tb td { padding: 7px 12px; } #heptab table.tb td small { display: inline; margin-left: 6px; font-size: 13px; }
</style>

</head>
<body>
<div id="viewport"><div id="stage"></div></div>
<div id="top"><div id="crumb"></div><div id="counter"></div></div>
<div id="progress"></div>
<div id="stepsind"></div>
<div id="br">
  <button id="b-ov" type="button" title="Overview (O)">overview</button>
  <button id="b-hud" type="button" title="Speaker notes (H)">notes</button>
  <button id="b-th" type="button" title="Theme (D)">◐ auto</button>
  <button id="b-help" type="button" title="Keys (?)">?</button>
</div>
<div id="tip"></div>
<div id="overview" class="ov" hidden></div>
<div id="help" class="ov" hidden></div>
<div id="hud" hidden></div>

function radar(vals, size = 300, labels = ['Software', 'Spec', 'Dataset', 'Metrics', 'Reference', 'Docs']) {
  const c = size / 2, r = size * 0.33, n = 6;
  const pt = (i, v) => { const a = -Math.PI / 2 + i * 2 * Math.PI / n; return [c + Math.cos(a) * r * v / 5, c + Math.sin(a) * r * v / 5]; };
  let g = '';
  for (let k = 1; k <= 5; k++) g += `<polygon points="${[...Array(n)].map((_, i) => pt(i, k).join(',')).join(' ')}" fill="none" stroke="var(--ink12)" stroke-width="1"/>`;
  for (let i = 0; i < n; i++) { const [x, y] = pt(i, 5); g += `<line x1="${c}" y1="${c}" x2="${x}" y2="${y}" stroke="var(--ink12)"/>`; }
  const poly = vals.map((v, i) => pt(i, v).join(',')).join(' ');
  g += `<polygon class="rpoly" points="${poly}" fill="color-mix(in srgb, var(--blue) 22%, transparent)" stroke="var(--blue)" stroke-width="2.5"/>`;
  labels.forEach((l, i) => { const [x, y] = pt(i, 6.4); g += `<text x="${x}" y="${y + 5}" text-anchor="middle" font-family="ui-monospace, Menlo, monospace" font-size="${size / 22}" fill="var(--ink60)">${l}</text>`; });
  return `<svg viewBox="0 0 ${size} ${size}" width="${size}" height="${size}" role="img" aria-label="rubric radar">${g}</svg>`;
}

function heatmap(mini = false) {

  for (const [m, mn] of MOT) {
    if (!mini) h += `<div class="rl">${mn}</div>`;
    for (const [d, dn] of DOM) {
      const a = STATS.cells[m + d] || [], v = a.length, p = Math.round(8 + 82 * v / max);

function swarm() {
  const W = 1420, H = 380, x0 = 60, x1 = W - 30, lo = 1.0, hi = 5.0, base = 300, r = 9;
  const X = v => x0 + (v - lo) / (hi - lo) * (x1 - x0);

  let g = `<rect x="${X(4.5)}" y="20" width="${X(5) - X(4.5) + 12}" height="${base - 6}" fill="color-mix(in srgb, var(--green) 9%, transparent)"/>`;
  g += `<line x1="${X(4.5)}" y1="20" x2="${X(4.5)}" y2="${base + 10}" stroke="var(--green)" stroke-dasharray="6 5" stroke-width="2"/>`;
  g += `<text x="${X(4.5) + 10}" y="42" font-family="ui-monospace, Menlo, monospace" font-size="16" fill="var(--green)">endorsed ≥ 4.5</text>`;
  g += `<line x1="${x0}" y1="${base + 14}" x2="${x1}" y2="${base + 14}" stroke="var(--ink40)"/>`;

  g += `<text x="${(x0 + x1) / 2}" y="${base + 72}" text-anchor="middle" font-family="ui-monospace, Menlo, monospace" font-size="15" fill="var(--ink40)">average rubric score (six categories, 0–5 each)</text>`;
  for (const [k, arr] of Object.entries(groups)) arr.forEach((t, i) => {

  });
  return `<svg viewBox="0 0 ${W} ${H}" width="${W}" height="${H}" role="img" aria-label="ratings of all tasks">${g}</svg>`;
}

function pareto() {
  const W = 620, H = 420, x0 = 70, y0 = 360, x1 = 590, y1 = 30;
  const P = [[120, .62], [180, .70], [260, .74], [330, .79], [420, .81], [520, .84], [610, .85], [230, .66], [380, .72], [470, .77], [300, .69], [560, .80]];
  const X = v => x0 + v / 700 * (x1 - x0), Y = v => y0 - (v - .55) / .35 * (y0 - y1), budget = 400;
  let g = `<rect x="${X(budget)}" y="${y1}" width="${x1 - X(budget)}" height="${y0 - y1}" fill="var(--chip)"/>`;
  g += `<line x1="${X(budget)}" y1="${y1}" x2="${X(budget)}" y2="${y0}" stroke="var(--accent)" stroke-width="2.5" stroke-dasharray="7 5"/>`;
  g += `<text x="${X(budget) - 8}" y="${y1 + 22}" text-anchor="end" font-family="ui-monospace, Menlo, monospace" font-size="15" fill="var(--accent)">constraint: latency budget</text>`;
  g += `<text x="${X(budget) + 10}" y="${y1 + 22}" font-family="ui-monospace, Menlo, monospace" font-size="15" fill="var(--ink40)">out of bounds</text>`;
  const ok = P.filter(p => p[0] <= budget).sort((a, b) => a[0] - b[0]); const front = []; let best = 0;
  for (const p of ok) if (p[1] > best) { front.push(p); best = p[1]; }
  g += `<polyline points="${front.map(p => X(p[0]) + ',' + Y(p[1])).join(' ')}" fill="none" stroke="var(--blue)" stroke-width="2.5"/>`;
  for (const p of P) { const inb = p[0] <= budget, f = front.includes(p); g += `<circle cx="${X(p[0])}" cy="${Y(p[1])}" r="${f ? 8 : 6}" fill="${inb ? (f ? 'var(--blue)' : 'color-mix(in srgb, var(--blue) 40%, var(--card))') : 'var(--ink12)'}" stroke="${inb ? 'var(--blue)' : 'var(--ink40)'}" stroke-width="1.5"/>`; }
  g += `<line x1="${x0}" y1="${y0}" x2="${x1}" y2="${y0}" stroke="var(--ink40)"/><line x1="${x0}" y1="${y0}" x2="${x0}" y2="${y1}" stroke="var(--ink40)"/>`;
  g += `<text x="${(x0 + x1) / 2}" y="${y0 + 36}" text-anchor="middle" font-family="ui-monospace, Menlo, monospace" font-size="15" fill="var(--ink60)">latency →</text>`;
  g += `<text x="${x0 - 20}" y="${(y0 + y1) / 2}" text-anchor="middle" transform="rotate(-90 ${x0 - 20} ${(y0 + y1) / 2})" font-family="ui-monospace, Menlo, monospace" font-size="15" fill="var(--ink60)">metric: accuracy →</text>`;
  g += `<text x="${X(120)}" y="${Y(.78)}" font-family="ui-monospace, Menlo, monospace" font-size="15" fill="var(--blue)">Pareto front</text>`;
  return `<svg viewBox="0 0 ${W} ${H}" width="${W}" height="${H}" role="img" aria-label="illustrative Pareto plot">${g}</svg>`;
}


function roc() {
  const W = 620, H = 430, x0 = 80, y0 = 370, x1 = 590, y1 = 30;
  const X = e => x0 + e * (x1 - x0), L = r => y0 - Math.log10(r) / 4 * (y0 - y1);
  const A = e => Math.exp(7.5 * Math.pow(1 - e, 1.6)), B = e => Math.exp(5.5 * (1 - e));
  const path = f => Array.from({ length: 86 }, (_, i) => { const e = 0.1 + i * 0.01; return `${X(e).toFixed(1)},${L(Math.min(f(e), 1e4)).toFixed(1)}`; }).join(' ');
  let g = '';
  for (let k = 0; k <= 4; k++) g += `<line x1="${x0}" y1="${L(10 ** k)}" x2="${x1}" y2="${L(10 ** k)}" stroke="var(--ink12)"/><text x="${x0 - 10}" y="${L(10 ** k) + 5}" text-anchor="end" font-family="ui-monospace, Menlo, monospace" font-size="14" fill="var(--ink60)">10${['⁰','¹','²','³','⁴'][k]}</text>`;
  for (let e = 0; e <= 1.001; e += 0.2) g += `<text x="${X(e)}" y="${y0 + 22}" text-anchor="middle" font-family="ui-monospace, Menlo, monospace" font-size="14" fill="var(--ink60)">${e.toFixed(1)}</text>`;
  g += `<line x1="${x0}" y1="${y0}" x2="${x1}" y2="${y0}" stroke="var(--ink40)"/><line x1="${x0}" y1="${y0}" x2="${x0}" y2="${y1}" stroke="var(--ink40)"/>`;
  for (const [wp, lab] of [[0.3, 'tight WP'], [0.7, 'loose WP']]) g += `<line x1="${X(wp)}" y1="${y1}" x2="${X(wp)}" y2="${y0}" stroke="var(--ink40)" stroke-dasharray="5 5"/><text x="${X(wp) + 6}" y="${y1 + 16}" font-family="ui-monospace, Menlo, monospace" font-size="14" fill="var(--ink40)">${lab}</text>`;
  g += `<polyline points="${path(A)}" fill="none" stroke="var(--blue)" stroke-width="3"/><polyline points="${path(B)}" fill="none" stroke="var(--accent)" stroke-width="3"/>`;
  for (const [f, c] of [[A, 'var(--blue)'], [B, 'var(--accent)']]) for (const wp of [0.3, 0.7]) g += `<circle cx="${X(wp)}" cy="${L(f(wp))}" r="6" fill="${c}"/>`;
  g += `<text x="${X(0.18)}" y="${L(A(0.18)) - 10}" font-family="ui-monospace, Menlo, monospace" font-size="16" font-weight="700" fill="var(--blue)">A</text>`;
  g += `<text x="${X(0.86)}" y="${L(B(0.86)) - 12}" font-family="ui-monospace, Menlo, monospace" font-size="16" font-weight="700" fill="var(--accent)">B</text>`;
  g += `<text x="${(x0 + x1) / 2}" y="${y0 + 50}" text-anchor="middle" font-family="ui-monospace, Menlo, monospace" font-size="15" fill="var(--ink60)">signal efficiency →</text>`;
  g += `<text x="22" y="${(y0 + y1) / 2}" text-anchor="middle" transform="rotate(-90 22 ${(y0 + y1) / 2})" font-family="ui-monospace, Menlo, monospace" font-size="15" fill="var(--ink60)">background rejection →</text>`;
  return `<svg viewBox="0 0 ${W} ${H}" width="${W}" height="${H}" role="img" aria-label="illustrative rejection versus efficiency curves">${g}</svg>`;
}

function ranks() {
  const R = [['Model A', .912, .006], ['Model B', .909, .007], ['Model C', .905, .006], ['BDT', .884, .004], ['cut-based', .861, .003]];
  const W = 720, x0 = 230, x1 = 640, lo = .85, hi = .925, X = v => x0 + (v - lo) / (hi - lo) * (x1 - x0), rh = 62, top = 30;
  let g = '';
  for (let v = .86; v <= .921; v += .02) g += `<line x1="${X(v)}" y1="${top - 10}" x2="${X(v)}" y2="${top + R.length * rh}" stroke="var(--ink12)"/><text x="${X(v)}" y="${top + R.length * rh + 24}" text-anchor="middle" font-family="ui-monospace, Menlo, monospace" font-size="14" fill="var(--ink60)">${v.toFixed(2)}</text>`;
  R.forEach(([n, m, e], i) => { const y = top + i * rh + rh / 2;
    g += `<text x="20" y="${y + 6}" font-family="ui-monospace, Menlo, monospace" font-size="17" fill="var(--ink)">#${i + 1}  ${n}</text>`;
    g += `<g data-step="2"><line x1="${X(m - e)}" y1="${y}" x2="${X(m + e)}" y2="${y}" stroke="${i < 3 ? 'var(--accent)' : 'var(--ink60)'}" stroke-width="4" stroke-linecap="round"/></g>`;
    g += `<circle cx="${X(m)}" cy="${y}" r="8" fill="${i < 3 ? 'var(--accent)' : 'var(--ink60)'}"/>`;
    g += `<text x="${W - 8}" y="${y + 5}" text-anchor="end" font-family="ui-monospace, Menlo, monospace" font-size="15" fill="var(--ink40)">${m.toFixed(3)}</text>`; });
  g += `<g data-step="2"><path d="M ${x0 - 30} ${top + 8} h 8 v ${3 * rh - 16} h -8" fill="none" stroke="var(--accent)" stroke-width="2"/><text x="${x0 - 16}" y="${top + 1.5 * rh + 5}" text-anchor="start" font-family="ui-monospace, Menlo, monospace" font-size="14" fill="var(--accent)">tied</text></g>`;
  g += `<text x="${(x0 + x1) / 2}" y="${top + R.length * rh + 52}" text-anchor="middle" font-family="ui-monospace, Menlo, monospace" font-size="15" fill="var(--ink60)">score (e.g. signal efficiency at fixed rate) →</text>`;
  return `<svg viewBox="0 0 ${W} ${top + R.length * rh + 70}" width="${W}" height="${top + R.length * rh + 70}" role="img" aria-label="illustrative leaderboard with uncertainties">${g}</svg>`;
}

}

  notes: `<p>The ontology builds on earlier efforts rather than replacing them. XAI-Bench is about explainability. FastML Science Benchmarks, which some of you know from hls4ml, brought real-time constraints like latency into benchmarks, but only for edge physics. PDEBench covers PDE surrogates. SciMLBench gave a taxonomy but was more of a blueprint than a runnable suite.</p><p>The ontology pulls these into one place under MLCommons governance, with a common definition, a rating system and an open submission process.</p>` });

/* ---------- Part II */
S({ id: 'o2', part: 2, crumb: 'Outline · Part II', title: 'Part II — what makes a good benchmark', budget: 10, html: outline(2).replace('The hour — <em>four parts</em>', 'Part II — <em>what makes a good benchmark</em>'), notes: `<p>Part two: what exactly is a benchmark, and how do you tell a good one from a weak one? I'll use the definition and rubric from the MLCommons Science Benchmarks Ontology, because it writes down what most of us know informally.</p>` });

S({ id: 'def', part: 2, crumb: 'Benchmark definition', title: 'Five elements of a benchmark', steps: 5, budget: 100,
  html: `<h2 class="k">A benchmark is a <em>standardized</em> version of a scientific application — in five elements</h2>
  <div class="grid" style="grid-template-columns:repeat(5,1fr);margin-top:8px;align-items:stretch">
   <div class="card lb" data-step="1"><div class="nm">1 · Problem spec</div><ul><li>the task: input data, expected output</li><li>system constraints: power, latency, hardware, as fixed bounds</li></ul><div class="ex"><b>e.g.</b> jet features in → jet class out, within an FPGA latency and resource budget</div></div>
   <div class="card lb" data-step="2"><div class="nm">2 · Dataset</div><ul><li>FAIR: findable, accessible, interoperable, reusable</li><li>bounded: no augmentation unless specified</li><li>one canonical train / val / test split</li></ul><div class="ex"><b>e.g.</b> a versioned release with a DOI and fixed splits</div></div>
   <div class="card lb" data-step="3"><div class="nm">3 · Metrics</div><ul><li>quantifiable, reproducible, computed on the held-out set</li><li>can be multi-dimensional → a Pareto front</li></ul><div class="ex"><b>e.g.</b> accuracy, AUC, latency, resource use</div></div>
   <div class="card lb" data-step="4"><div class="nm">4 · Reference solution</div><ul><li>meets the spec and constraints</li><li>reports every metric</li><li>the baseline everyone compares to</li></ul><div class="ex"><b>e.g.</b> a published, quantized MLP with its training code</div></div>
   <div class="card lb" data-step="5"><div class="nm">5 · Docs &amp; protocol</div><ul><li>reproduce the reference in a versioned, defined environment</li><li>hardware references need a bill of materials</li></ul><div class="ex"><b>e.g.</b> a pinned container and a one-line run command</div></div>
  </div>
  <p class="cap" style="margin-top:22px">HEP examples in the dashed rows are ours, in the spirit of the ontology’s Jet Classification benchmark</p>`,
  notes: `<p>The paper defines a benchmark as a carefully defined, standardized version of a scientific application, used to make quantifiable comparisons of solutions. Five elements.</p><p>One, the problem specification: what goes in, what comes out, and the system constraints. Two, the dataset, which should follow FAIR, be bounded, and come with one canonical split. Three, the metrics: quantifiable and reproducible, possibly several at once. Four, a reference solution that satisfies the spec and reports every metric, so others have a baseline. Five, documentation and a protocol to reproduce that reference.</p><p>The dashed lines show what each would look like for a jet-tagging benchmark on an FPGA, which many of you have seen.</p>` });

S({ id: 'constraints', part: 2, crumb: 'Constraints vs metrics', title: 'Constraints are bounds, metrics are compared', steps: 3, budget: 70,
  html: `<h2 class="k">Constraints are <em>bounds</em>. Metrics are what you <em>compare</em>.</h2>
  <div class="cols" style="gap:60px">
   <div class="col" style="flex:1"><ul class="t">
     <li data-step="1"><b>Constraint</b>: a fixed upper or lower limit, not part of the score<small>power, latency, throughput, target hardware, technology node</small></li>
     <li data-step="2"><b>Metric</b>: the measurable basis for comparison<small>MSE on held-out data, conserved-quantity error, CPU/GPU time, memory; robustness when noise is added</small></li>
     <li data-step="3"><b>One task, several benchmarks</b><small>same dataset: one benchmark fixes a minimum accuracy and tests throughput, another asks only for the best accuracy</small></li>
   </ul></div>
   <div class="col" style="flex:0 0 640px"><div class="card" style="padding:10px">${pareto()}</div><p class="cap">illustrative — think of the Level-1 (L1) trigger: a fixed latency budget, then the best accuracy within it</p></div>
  </div>`,
  notes: `<p>This distinction matters a lot in our field. A constraint is a fixed bound: the latency budget of the Level-1 trigger, the resources on an FPGA, a power envelope. You either meet it or you don't; it isn't scored. Metrics are what you compare, and there can be several, so solutions sit on a Pareto front.</p><p>And you can define more than one benchmark on the same task and dataset: one with an accuracy floor that measures throughput, another that just asks for the best accuracy.</p>` });

S({ id: 'rubric', part: 2, crumb: 'Rating rubric', title: 'Six categories, 0–5 each', steps: 6, budget: 100,
  html: `<h2 class="k">Six categories, <em>0–5</em> points each — one point per criterion met</h2>
  <div class="grid" style="grid-template-columns:repeat(3,1fr);gap:16px">
   <div class="card lb" data-step="1"><div class="nm">Software environment</div><ul><li>baseline code available, complete, documented</li><li>runs <b>without modification</b></li><li>containerized, or full setup steps</li></ul></div>
   <div class="card lb" data-step="2"><div class="nm">Problem specification</div><ul><li>system constraints given</li><li>task is clear</li><li>data format, inputs and outputs specified</li></ul></div>
   <div class="card lb" data-step="3"><div class="nm">Dataset</div><ul><li>one point per FAIR principle (4)</li><li>+1 for well-defined train / test (/ val) splits</li></ul></div>
   <div class="card lb" data-step="4"><div class="nm">Performance metrics</div><ul><li>definition: 3 fully defined · 2 named, details missing · 1 vague · 0 none</li><li>quality: 2 captures performance fully · 1 partially · 0 not</li></ul></div>
   <div class="card lb" data-step="5"><div class="nm">Reference solution</div><ul><li>public and documented</li><li>hardware / software requirements listed</li><li>every metric evaluated; model, hyperparameters and training code open</li></ul></div>
   <div class="card lb" data-step="6"><div class="nm">Documentation</div><ul><li>task, background, motivation explained</li><li>evaluation criteria explained</li><li>an academic paper exists</li></ul></div>
  </div>`,
  notes: `<p>To judge quality, the ontology rates each benchmark in six categories that line up with the five elements, plus software. Each category is scored out of five, one point per criterion met.</p><p>Software environment: is the baseline code there, complete, documented, does it run without modification, is it containerized? Problem spec: constraints, task, data format, inputs, outputs. Dataset: one point per FAIR principle plus one for proper splits. Metrics combine two scales: how well they're defined, up to three, and how well they capture performance, up to two. Reference solution: public, documented, requirements listed, every metric reported, model open. Documentation: task, background, motivation, evaluation criteria, and a paper.</p>` });

S({ id: 'endorse', part: 2, crumb: 'Endorsement', title: 'Average ≥ 4.5 earns endorsement', steps: 2, budget: 45,
  html: `<div class="cols" style="gap:70px">
   <div class="col" style="flex:1">
     <div class="eyebrow">the bar</div>
     <h1 style="font-size:70px;margin-top:14px">Average <em>≥ 4.5 / 5</em> across all six</h1>
     <p class="lead" style="margin-top:22px;color:var(--ink)">earns the <b>MLCommons Science Benchmark Endorsement</b>: a particularly high-quality benchmark within the wider ontology</p>
     <ul class="t sm" data-step="2" style="margin-top:34px">
      <li>New benchmarks enter through an <b>open submission workflow</b><small>reviewed by the MLCommons Science Working Group</small></li>
      <li>The ontology is not static<small>new domains, AI/ML motifs and computing motifs are added as workloads evolve</small></li>
     </ul>
   </div>
   <div class="col" style="flex:0 0 auto;text-align:center">
     <div class="card" style="padding:16px 24px">${radar([5, 5, 5, 5, 5, 5], 400)}
      <div class="mono" style="font-size:16px;color:var(--ink60)">a 5.00 benchmark fills the hexagon</div></div>
   </div></div>`,
  notes: `<p>Average four and a half or more across the six categories and a benchmark earns the MLCommons Science Benchmark Endorsement. That's the signal that it's well specified, reproducible and documented.</p><p>The ontology also isn't frozen. Anyone can submit a benchmark through an open workflow; the Science Working Group reviews it against this rubric.</p>` });

S({ id: 'o3', part: 3, crumb: 'Outline · Part III', title: 'Part III — where HEP stands', budget: 10, html: outline(3).replace('The hour — <em>four parts</em>', 'Part III — <em>where HEP stands</em>'), notes: `<p>Part three: if we score the field's existing benchmarks this way, where does HEP stand?</p>` });

S({ id: 'overview', part: 9, crumb: 'Ontology overview', title: 'Domains × motifs → ratings → compute patterns', budget: 45,
  html: `<h2 class="k">Taxonomy → <em>ratings</em> → computing patterns</h2>
  <div class="fig" style="margin-top:20px"><img src="${IMG.fig1}" alt="Ontology overview: domains by AI motifs grid, per-benchmark rating radar, computing-pattern clusters"></div>
  <div class="grid" style="grid-template-columns:repeat(3,1fr);margin-top:26px;gap:30px;font-size:19px;color:var(--ink60)">
   <div><b style="color:var(--ink)">Classify</b> every task by scientific domain and AI/ML motif</div>
   <div><b style="color:var(--ink)">Qualify</b> each benchmark with the six-category rubric</div>
   <div><b style="color:var(--ink)">Characterize</b> workloads by measured behaviour: memory, throughput, compute</div>
  </div>
  <p class="cap">Fig. 1 of arXiv:2511.05614</p>`,
  notes: `<p>Here's the whole idea in one figure. Tasks are classified on a grid of scientific domain by AI/ML motif. Each benchmark is rated with the rubric, which you can draw as a radar. And the third step uses measured behaviour, like memory, throughput and compute, to find workloads that look alike.</p>` });

S({ id: 'heatmap', part: 3, crumb: 'Domains × motifs', title: 'Where the tasks are', steps: 2, budget: 70,
  html: `<h2 class="k"><span id="hm-n"></span> tasks, <em>seven</em> domains, <em>eight</em> motifs</h2>
  <div class="cols" style="gap:50px;align-items:flex-start">
   <div class="col" style="flex:0 0 1000px">${heatmap()}<p class="cap" style="text-align:left;margin-left:260px">hover a cell for its benchmarks · a task can list several domains but only one AI/ML motif</p></div>
   <div class="col" style="flex:1;padding-top:10px"><ul class="t sm">
     <li><b>Classification</b> and <b>reasoning</b> dominate</li>
     <li data-step="2" class="hl">HEP contributes the most entries: <span id="hm-hep"></span> of <span id="hm-ent"></span><small>8 classification · 4 anomaly detection · 3 reasoning · 2 generative · regression, RL, forecasting</small></li>
     <li data-step="2">Thin spots are opportunities<small>multimodal reasoning, RL / control and forecasting barely appear in HEP or anywhere else</small></li>
   </ul></div>
  </div>`,
  notes: `<p>This is Fig. 2 of the paper, redrawn: the number of benchmark tasks for each motif and domain. Hover over a cell to see which benchmarks are in it.</p><p>Classification and reasoning dominate overall. And look at the red column: high energy physics contributes more entries than any other domain. We're a benchmark-heavy field, in large part thanks to the real-time ML community and challenges like CaloChallenge.</p><p>The empty rows are opportunities: multimodal reasoning and RL-for-control are almost absent.</p>` });

S({ id: 'ratings', part: 3, crumb: 'How good are they?', title: 'Most tasks, one endorsement', steps: 2, budget: 80,
  html: `<h2 class="k">HEP brings the most tasks, and <em id="rt-word">one</em> endorsement</h2>
  <div class="card" style="padding:8px 10px;margin-top:4px">${swarm()}</div>
  <div style="display:flex;gap:26px;margin-top:18px;align-items:baseline;font-size:19px">
    <span><svg width="14" height="14"><circle cx="7" cy="7" r="6" fill="var(--accent)"/></svg> HEP task</span><span><svg width="14" height="14"><circle cx="7" cy="7" r="6" fill="var(--ink40)"/></svg> other domains</span>
    <span class="muted" style="margin-left:auto" data-step="2"><b style="color:var(--ink)" id="rt-end"></b> of <span id="rt-n"></span> tasks endorsed · HEP mean <b style="color:var(--accent)" id="rt-hm"></b> vs <span id="rt-am"></span> overall · the one HEP endorsement: <b style="color:var(--ink)">CaloChallenge 2022</b></span>
  </div>
  <p class="cap">every task in Table II of arXiv:2511.05614 · hover a dot for its name and score</p>`,
  notes: `<p>Now quality. Every dot is one task, placed by its average rubric score; the red ones are HEP. The green band on the right is the endorsement region.</p><p>The point for this room: we contribute the most tasks, but our average sits below the overall average, and only one HEP task clears the bar, CaloChallenge 2022. Several of the lowest-rated tasks in the whole ontology are ours.</p><p>That isn't because the science is weak. It's mostly missing pieces: no packaged reference solution, metrics that are named but not defined, code that needs edits to run. Those are cheap to fix, which is what Part IV is about.</p>` });

S({ id: 'hep', part: 3, crumb: 'The HEP benchmarks', title: 'The HEP entries, by score', budget: 70,
  html: `<h2 class="k">The HEP entries — benchmarks <em>you</em> already know</h2>
  <div id="heptab" style="display:grid;grid-template-columns:1fr 1fr;gap:22px;margin-top:4px"></div>
  <p class="cap" style="text-align:left;margin-top:14px"><span class="tag lhc">LHC</span> = built around LHC detectors or data · names from the ontology’s source data (long ones shortened) · multi-domain entries (The Well, GPQA, CURIE) include HEP among their domains</p>`,
  notes: `<p>Here are the HEP entries by score. Many will be familiar: CaloChallenge, Jet Classification, ultrafast jet classification at the HL-LHC, Smart Pixels for LHC, and the LHC New Physics Dataset for anomaly detection in the trigger.</p><p>Look at what's lower down. Several real-time and anomaly-detection benchmarks score around three. Those are exactly the CMS-relevant problems where a better-specified benchmark would help the most people.</p>` });

S({ id: 'motifs', part: 9, crumb: 'Computing motifs', title: 'What bounds the workload', steps: 4, budget: 60,
  html: `<h2 class="k">Computing motifs — what <em>bounds</em> the workload</h2>
  <div class="grid" style="grid-template-columns:repeat(4,1fr);margin-top:20px">
   <div class="card lb" data-step="1"><div class="nm">Latency bound</div><ul><li>a fixed latency constraint, or “produce an output as fast as possible”</li></ul><div class="ex"><b>HEP:</b> Level-1 trigger inference on FPGAs</div></div>
   <div class="card lb" data-step="2"><div class="nm">Memory bound</div><ul><li>tasks that need large amounts of data at once</li></ul><div class="ex"><b>HEP:</b> graph-based tracking on a full high-pileup event</div></div>
   <div class="card lb" data-step="3"><div class="nm">Throughput bound</div><ul><li>consume and produce data at very high rates, often limited by bandwidth</li></ul><div class="ex"><b>HEP:</b> on-detector data reduction, 40 MHz scouting</div></div>
   <div class="card lb" data-step="4"><div class="nm">Utilization bound</div><ul><li>a fixed compute limit, or an inherently expensive task</li></ul><div class="ex"><b>HEP:</b> detector simulation and its fast surrogates</div></div>
  </div>
  <p class="lead" style="margin-top:34px">A motif is a property of an <b>implementation</b> more than of the benchmark itself, and one workload can be bound by several.</p>
  <p class="cap">definitions from §IV-C of the paper; the HEP examples are ours</p>`,
  notes: `<p>The third axis is computing behaviour. The paper sorts workloads by what limits them: latency, memory, throughput or utilization. I've added a HEP example for each. The L1 trigger is the classic latency-bound case. Tracking on a full high-pileup event is memory heavy. On-detector data reduction and 40 MHz scouting are throughput bound. Simulation is the expensive, utilization-bound workload that fast surrogates try to replace.</p><p>Note that these are properties of an implementation as much as of the task. The same task on a GPU and on an FPGA can be bound by different things.</p>` });

S({ id: 'cluster', part: 9, crumb: 'Clustering workloads', title: 'Clustering by measured power', steps: 2, budget: 70,
  html: `<h2 class="k">Find similar workloads by <em>measuring</em> them</h2>
  <div class="fig capped" style="margin-top:6px"><img src="${IMG.fig3}" alt="Dendrogram of GPU workloads clustered by power distribution; threshold 0.72 gives low-power, high-power and mixed clusters"></div>
  <div class="cols" style="gap:40px;margin-top:22px;flex:0 0 auto">
   <ul class="t sm col" style="flex:1"><li>Profile each benchmark solution's power with <span class="mono">nvidia-smi</span> / NVML<small>graph analytics, HPC, HPC+ML and ML GPU workloads; different inputs counted separately</small></li></ul>
   <ul class="t sm col" style="flex:1" data-step="2"><li>Hierarchical clustering on <b>cosine distance</b>; cut at 0.72 → <b>K = 3</b><small>low-power · high-power · mixed. A user's priorities pick the axes, so the clusters adapt to what they care about</small></li></ul>
  </div>
  <p class="cap">Fig. 3 of arXiv:2511.05614</p>`,
  notes: `<p>How do you find workloads that behave alike without profiling every new application in detail? The paper shows one approach. Profile the power draw of each benchmark solution, compute the cosine distance between every pair, and cluster hierarchically.</p><p>Cutting this dendrogram at 0.72 gives three groups: low power, high power and mixed. In the full system, a user says which axes matter to them, such as power, accuracy or documentation, and the clustering returns a representative subset.</p>` });

/* ---------- Part IV */
S({ id: 'o4', part: 4, crumb: 'Outline · Part IV', title: 'Part IV — benchmarking well', budget: 10, html: outline(4).replace('The hour — <em>four parts</em>', 'Part IV — <em>benchmarking well</em>'), notes: `<p>Part four: the reasoning and technique behind a benchmark you can trust. Less about tooling, more about the decisions you make before and after you run anything.</p>` });

S({ id: 'question', part: 4, crumb: 'Start from the question', title: 'Write the benchmark before the model', steps: 2, budget: 70,
  html: `<h2 class="k">Write the benchmark <em>before</em> the model</h2>
  <div class="flow" style="justify-content:center;gap:10px;margin-bottom:34px">
   <div class="bx" style="width:230px"><b>Decision</b><br><small class="faint">what will this result change?</small></div><span class="ar">→</span>
   <div class="bx" style="width:230px"><b>Task</b><br><small class="faint">inputs, outputs</small></div><span class="ar">→</span>
   <div class="bx" style="width:230px"><b>Constraints</b><br><small class="faint">the bounds of the real deployment</small></div><span class="ar">→</span>
   <div class="bx" style="width:230px"><b>Metric</b><br><small class="faint">what “better” means</small></div><span class="ar">→</span>
   <div class="bx ai" style="width:230px">Baseline<br><small>what you must beat</small></div>
  </div>
  <div class="cols" style="gap:40px;align-items:flex-start">
   <div class="col card lb" style="flex:1" data-step="1"><div class="nm">a CMS-flavoured example</div><ul>
     <li><b>Decision:</b> should a new tagger replace the current Level-1 algorithm?</li>
     <li><b>Task:</b> trigger objects in → keep / reject out</li>
     <li><b>Constraints:</b> the latency and FPGA resources the trigger board actually has</li>
     <li><b>Metric:</b> signal efficiency at the fixed trigger rate</li>
     <li><b>Baseline:</b> the algorithm running today, on the same events</li></ul></div>
   <div class="col" style="flex:1" data-step="2"><ul class="t sm">
     <li>Fix all five <b>before</b> training anything<small>choices made after seeing results drift toward whatever your model happens to do well</small></li>
     <li>Compare against the <b>traditional workflow</b>, not only other ML<small>that comparison is the AI advantage, and the one decision makers ask about</small></li>
     <li>Several decisions → several benchmarks on one dataset</li></ul></div>
  </div>`,
  notes: `<p>The most important technique is the order you do things in. Write the benchmark before the model. Start from the decision the result will inform, then the task, then the constraints of the real deployment, then the metric, then the baseline.</p><p>In CMS terms: should a new tagger replace the current Level-1 algorithm? Then the constraints are the latency and resources the board really has, the metric is signal efficiency at the fixed trigger rate, and the baseline is the algorithm running today on the same events.</p><p>If you choose the metric after seeing results, it drifts toward whatever your model happens to be good at. And always include the traditional method, because that's the comparison anyone deciding whether to adopt your model actually cares about.</p>` });

S({ id: 'baselines', part: 4, crumb: 'Baselines', title: 'Three baselines every result needs', steps: 3, budget: 80,
  html: `<h2 class="k">Three baselines <em>every</em> result needs</h2>
  <div class="cols" style="gap:50px;align-items:flex-start">
   <div class="col" style="flex:.85"><ul class="t sm">
    <li data-step="1"><b>Trivial</b>: predict the mean, the majority class, random<small>sets the floor; anything near it means the metric or the task is broken</small></li>
    <li data-step="2"><b>Traditional</b>: the cut-based or physics-driven method in use today<small>this is the comparison that justifies adopting a model</small></li>
    <li data-step="2"><b>Simple ML</b>: a BDT or small MLP on the same inputs<small>tells you whether the fancy architecture is what helps</small></li>
    <li data-step="3" class="hl">Give every baseline the same tuning budget you gave your model</li>
   </ul></div>
   <div class="col" style="flex:1.15" data-step="1">
    <div class="eyebrow" style="margin-bottom:10px">a real leaderboard: AXESS, FPGA resource and latency prediction</div>
    <div class="fig" style="padding:6px"><img src="${IMG.lboard}" alt="Leaderboard: a trained model with mean R2 0.809 vs a predict-the-mean entry at 0.0"></div>
    <div style="display:flex;gap:30px;margin-top:20px;font-size:21px;flex-wrap:wrap"><span>trained model: <b>R² 0.81</b> · SMAPE 10.3%</span><span class="muted">predict-the-mean: <b>R² 0.00</b> · SMAPE 114%</span></div>
    <p class="muted" style="font-size:18px;margin-top:12px">A big gap to the trivial entry is evidence the metric measures something real.</p>
   </div>
  </div>`,
  notes: `<p>A benchmark without baselines can't tell you anything. You want three kinds. A trivial one: predict the mean, the majority class, or random. It sets the floor, and if a serious model lands near it, the metric or the task is broken. A traditional one: the method in use today. And a simple ML one, like a BDT on the same inputs, to tell you whether the complicated architecture is really what's helping.</p><p>Here's a real leaderboard from the AXESS benchmark, which predicts FPGA resources and latency. The trained model gets an R-squared of 0.81; the predict-the-mean entry gets zero. That gap tells you the metric measures something.</p><p>And be fair: give the baselines the same tuning effort as your model. A lot of reported "AI advantage" is really a well-tuned model against an untuned baseline.</p>` });

S({ id: 'metrics', part: 4, crumb: 'Metrics', title: 'Metrics that match the physics', steps: 3, budget: 80,
  html: `<h2 class="k">Pick metrics that match the <em>physics</em></h2>
  <div class="cols" style="gap:50px">
   <div class="col" style="flex:0 0 620px"><div class="card" style="padding:10px">${roc()}</div><p class="cap">illustrative curves · rejection = 1 / background efficiency</p></div>
   <div class="col" style="flex:1"><ul class="t sm">
    <li data-step="1">One summary number can hide the <b>working point</b> you care about<small>A wins at a tight working point, B at a loose one; an analysis lives at one of them</small></li>
    <li data-step="2"><b>Fully define</b> it: formula, implementation, which split, which events<small>“accuracy” is a name; the scoring function is the definition</small></li>
    <li data-step="2">Several metrics → report all of them, or the Pareto front<small>keep constraints such as latency as pass / fail bounds, not folded into a score</small></li>
    <li data-step="3" class="hl">Once a metric becomes the target, people optimize the metric<small>so make sure that improving it really means improving the physics</small></li>
   </ul></div>
  </div>`,
  notes: `<p>Metric choice is where physics judgment matters most. These two curves are illustrative: background rejection against signal efficiency, the way we plot taggers. Model A is better at a tight working point, B at a loose one. A single summary like AUC can rank them either way, but an analysis runs at one working point. So the metric should be evaluated where you'd actually operate.</p><p>Second, fully define the metric. "Accuracy" is just a name; the definition is the formula, the code, the split and the event selection. Third, if there are several metrics, report all of them, and keep constraints like latency as pass-fail bounds rather than mixing them into a score.</p><p>And remember Goodhart's law: once a metric becomes the target, people optimize the metric. Make sure moving it really means moving the physics.</p>` });

S({ id: 'splits', part: 4, crumb: 'Splits and leakage', title: 'Splits, leakage and shift', steps: 4, budget: 80,
  html: `<h2 class="k">The test set is <em>sacred</em> — and easy to contaminate</h2>
  <div class="grid" style="grid-template-columns:repeat(4,1fr);gap:16px">
   <div class="card lb" data-step="1"><div class="nm">Same event, both sides</div><ul><li>several jets or candidates from one event, split across train and test</li><li>reused MC samples or generator seeds</li></ul><div class="ex"><b>fix:</b> split by event or sample, not by row</div></div>
   <div class="card lb" data-step="2"><div class="nm">Truth sneaking in</div><ul><li>inputs derived from Monte Carlo (MC) simulation truth</li><li>labels encoded in file order, sample names or weights</li></ul><div class="ex"><b>fix:</b> list the forbidden fields in the spec</div></div>
   <div class="card lb" data-step="3"><div class="nm">Tuning on test</div><ul><li>hyperparameter search or early stopping on the test split</li><li>many submissions against one test set</li></ul><div class="ex"><b>fix:</b> a validation split, and a held-out test touched once</div></div>
   <div class="card lb" data-step="4"><div class="nm">Distribution shift</div><ul><li>train on simulation, deploy on data</li><li>different pileup or run conditions</li></ul><div class="ex"><b>fix:</b> state it, and test on the shifted set too</div></div>
  </div>
  <p class="lead" style="margin-top:30px">The ontology's answer: <b>one canonical, non-overlapping split</b>, curated once, and a <b>bounded</b> dataset with no augmentation unless the benchmark specifies it.</p>`,
  notes: `<p>The test set is the thing everyone's result depends on, and it's easy to contaminate. Four patterns I see in HEP.</p><p>Same event on both sides: several jets from one event, some in train and some in test, or the same MC sample reused. Split by event or by sample. Truth sneaking in: inputs derived from MC truth, or labels you can infer from file order or weights. Write down the forbidden fields. Tuning on test: early stopping or hyperparameter scans on the test split, or a leaderboard where people submit over and over. Use a validation split and touch the test set once. And distribution shift: training on simulation and deploying on data. Say so, and test on the shifted set.</p><p>That's why the ontology insists on one canonical, non-overlapping split, curated once, and a bounded dataset.</p>` });

S({ id: 'uncert', part: 4, crumb: 'Uncertainty', title: 'Is #1 actually better?', steps: 2, budget: 80,
  html: `<h2 class="k">Is #1 actually <em>better</em>?</h2>
  <div class="cols" style="gap:50px">
   <div class="col" style="flex:0 0 720px"><div class="card" style="padding:10px">${ranks()}</div><p class="cap">illustrative leaderboard · bars show the spread over training seeds and test-set bootstraps</p></div>
   <div class="col" style="flex:1"><ul class="t sm">
    <li>You'd never quote a cross-section without an uncertainty<small>a leaderboard score is a measurement too</small></li>
    <li data-step="2"><b>Seeds</b>: retrain with several random seeds; report mean and spread</li>
    <li data-step="2"><b>Test set</b>: bootstrap it to see how much the score moves</li>
    <li data-step="2" class="hl">Differences smaller than the spread are ties<small>here, the top three are statistically indistinguishable</small></li>
   </ul></div>
  </div>`,
  notes: `<p>This one should feel natural to physicists. You would never quote a cross-section without an uncertainty, but leaderboards quote scores to four decimals with no error bar at all.</p><p>On the left is an illustrative leaderboard. Ranked by the central value, there's a clear winner. Now add the spread: retrain each model with several seeds, and bootstrap the test set. The top three overlap; they're tied. Only the gap to the simpler baselines is real.</p><p>So: report the mean and spread over seeds, bootstrap the test set, and treat differences smaller than the spread as ties.</p>` });

S({ id: 'scorer1', part: 4, crumb: 'One scorer', title: 'Same steps, same scorer, every model', steps: 2, budget: 60,
  html: `<h2 class="k">Same steps, same scorer, <em>every</em> model</h2>
  <div class="flow" style="justify-content:center;margin:4px 0 40px">
   <div class="bx" style="width:210px">Fetch<br><small class="faint">pinned data + weights</small></div><span class="ar">→</span><div class="bx" style="width:210px">Prepare<br><small class="faint">identical inputs</small></div><span class="ar">→</span><div class="bx ai" style="width:210px">Run<br><small>the only part that changes</small></div><span class="ar">→</span><div class="bx" style="width:210px">Score<br><small class="faint">one truth function</small></div><span class="ar">→</span><div class="bx" style="width:210px">Compare<br><small class="faint">to committed results</small></div></div>
  <div class="cols" style="gap:50px;align-items:flex-start">
   <ul class="t sm col" style="flex:1"><li>The reference solution and every new model go through <b>exactly the same steps</b><small>different preprocessing or a private scoring script is how two papers end up “comparing” different things</small></li>
    <li>A new model plugs in as <b>one predictions file</b>, scored by the shared function</li></ul>
   <ul class="t sm col" style="flex:1" data-step="2"><li>Commit the reference numbers, so “did I reproduce it?” is a <b>diff</b><small>AXESS: a workstation CPU run and a GPU run on an HPC system agreed to 2.4 × 10⁻⁴</small></li>
    <li>Reproducing on different hardware is itself a test of the benchmark</li></ul>
  </div>`,
  notes: `<p>A simple discipline that removes a lot of confusion: the reference solution and every new model go through exactly the same steps. Fetch pinned data, prepare identical inputs, run the model, which is the only part that changes, and score with one shared function.</p><p>When two papers use different preprocessing or private scoring scripts, they aren't comparing the same thing, even with the same dataset name. And if you commit the reference numbers, reproducing them becomes a diff. For AXESS, a workstation CPU run and a GPU run on an HPC system agreed to a few parts in ten thousand.</p>` });

S({ id: 'lessons', part: 4, crumb: 'Check before you trust', title: 'Lessons that generalize', steps: 2, budget: 60,
  html: `<h2 class="k">Lessons that <em>generalize</em></h2>
  <div class="cols" style="gap:40px;align-items:flex-start">
   <div class="col card lb" style="flex:1" data-step="1"><div class="nm">Check before you trust</div><ul class="t sm" style="margin-top:8px">
    <li>Make sure you ran what you think you ran<small>same model, same version, same code</small></li>
    <li>Make sure you're scoring the right answer<small>we found published checkpoints trained on a different label than the one being scored</small></li>
    <li>Share the whole recipe, not just the model<small>preprocessing, prompts and settings matter too</small></li>
    <li>Reproduce the published numbers<small>if they don't match, find out why and write it down</small></li></ul></div>
   <div class="col card lb" style="flex:1" data-step="2"><div class="nm">Make it easy for others to trust</div><ul class="t sm" style="margin-top:8px">
    <li>Pin your versions<small>software and data, so a rerun next year matches</small></li>
    <li>Test on a few real examples<small>catches silent breakage in seconds</small></li>
    <li>Keep a log of what you checked<small>what, the result, when, and on which machine</small></li>
    <li>Be upfront about limitations<small>say where your benchmark falls short</small></li></ul></div>
  </div>
  <p class="statement" style="flex:0 0 auto;margin-top:26px;font-family:var(--serif);font-size:30px;font-style:italic;color:var(--accent)">Reading isn't verifying.</p>`,
  notes: `<p>Building AXESS taught us a few lessons that apply to any benchmark, built or borrowed.</p><p>Check before you trust: make sure you ran the model and version you think you did, that you're scoring the right label (we found published checkpoints trained on a different label than the one being scored), share the whole recipe, and reproduce the published numbers.</p><p>Then make it easy for others to trust you: pin versions, test on a few real examples, keep a log of what you checked, and state limitations. Reading a paper isn't verifying it.</p>` });

S({ id: 'reading', part: 4, crumb: 'Reading a leaderboard', title: 'Questions to ask of any result', steps: 2, budget: 60,
  html: `<h2 class="k">Seven questions to ask of <em>any</em> benchmark result</h2>
  <div class="grid" style="grid-template-columns:1fr 1fr;gap:16px 40px;margin-top:6px">
   ${[['What is the baseline?', 'trivial, traditional and simple-ML, tuned as hard as the winner'],
      ['Is the metric the one I care about?', 'at my working point, under my constraints'],
      ['Were the constraints met?', 'latency, resources or power as bounds, not footnotes'],
      ['Was the test set ever seen?', 'by training, tuning, early stopping or repeated submissions'],
      ['How big is the uncertainty?', 'seeds and test-set bootstrap; are the top entries tied?'],
      ['Does it transfer?', 'simulation to data, other pileup, other run conditions'],
      ['Can I rerun it?', 'public code, pinned environment, committed reference numbers']]
     .map(([q, a], i) => `<div class="card" ${i >= 4 ? 'data-step="2"' : ''} style="display:flex;gap:16px;align-items:baseline"><span class="mono" style="color:var(--accent);font-weight:700;font-size:22px">${i + 1}</span><div><div style="font-size:23px;font-weight:600">${q}</div><div class="muted" style="font-size:18px;margin-top:4px">${a}</div></div></div>`).join('')}
   <div class="card" data-step="2" style="display:flex;align-items:center;background:color-mix(in srgb, var(--accent) 8%, var(--card));border-color:var(--accent)"><div style="font-family:var(--serif);font-size:26px;font-style:italic;color:var(--accent)">Most of these are the rubric's categories, asked as a reader.</div></div>
  </div>`,
  notes: `<p>Most of you will read far more benchmark results than you build. Here are seven questions to ask of any of them. What's the baseline, and was it tuned as hard as the winner? Is the metric the one I care about, at my working point? Were the constraints met? Was the test set ever seen? How large is the uncertainty, and are the top entries really tied? Does the result transfer from simulation to data? And can I rerun it?</p><p>If that list feels familiar, it should: most of it is the rubric from Part II, asked from the reader's side.</p>` });

S({ id: 'axess', part: 4, crumb: 'Worked example · AXESS', title: 'What a 5/5 benchmark looks like', steps: 2, budget: 70,
  html: `<h2 class="k">Worked example — what a <em>5 / 5</em> benchmark looks like</h2>

   <div class="col grid" style="flex:1;grid-template-columns:1fr 1fr;gap:14px">
    <div class="card lb"><div class="nm">Problem spec</div><ul><li>NN config in → FPGA resources + latency out; target device fixed as a constraint</li></ul></div>
    <div class="card lb"><div class="nm">Dataset</div><ul><li>public, versioned, one fixed set of splits</li></ul></div>
    <div class="card lb"><div class="nm">Metrics</div><ul><li>R², SMAPE, RMSE with formulas written out, plus timings</li></ul></div>
    <div class="card lb"><div class="nm">Reference solution</div><ul><li>GNN and Transformer surrogates, compared against running synthesis</li></ul></div>

S({ id: 'exercise', part: 4, crumb: 'Exercise · score it yourself', title: 'Score it yourself', budget: 240,

/* ---------- glossary: each term is defined in the footer of the first main-flow scene that uses it */
const GLOSS = {
  'AI advantage': 'a measured gain over the traditional workflow, on the benchmark’s own metrics',
  'ontology': 'a structured catalogue: shared definitions, categories and ratings',
  'FPGA': 'field-programmable gate array, a reconfigurable chip used in trigger and readout electronics',
  'FAIR': 'findable, accessible, interoperable, reusable',
  'AUC': 'area under the ROC curve, a one-number summary of a classifier',
  'MLP': 'multilayer perceptron, a basic fully connected neural network',
  'DOI': 'digital object identifier, a permanent citable link to a dataset or paper',
  'Pareto front': 'the set of best trade-offs: no metric improves without another getting worse',
  'container': 'a packaged software environment with every dependency pinned',
  'L1 trigger': 'Level-1 trigger, the hardware first stage that picks which collisions to keep, within microseconds',
  'MSE': 'mean squared error',
  'technology node': 'the chip manufacturing process generation',
  'hyperparameters': 'settings chosen before training, such as layer sizes or learning rate',
  'MLCommons': 'the open engineering consortium behind the MLPerf benchmarks',
  'HEP': 'high energy physics',
  'AI/ML motif': 'the type of machine-learning task, e.g. classification or regression',
  'entry': 'a task counted once for each domain it lists',
  'LHC / HL-LHC': 'Large Hadron Collider / its High-Luminosity upgrade',
  'DUNE': 'Deep Underground Neutrino Experiment',
  'HDR': 'the NSF Harnessing the Data Revolution program',
  'tagger': 'a classifier that labels jets or other physics objects',
  'trigger rate': 'how many collisions per second the trigger keeps',
  'BDT': 'boosted decision trees',
  'R²': 'coefficient of determination: 1 is perfect, 0 is no better than predicting the mean',
  'SMAPE': 'symmetric mean absolute percentage error',
  'AXESS': 'a benchmark that predicts FPGA resources and latency for neural networks',
  'WP': 'working point, the cut on the classifier output that an analysis actually uses',
  'signal efficiency / rejection': 'fraction of signal kept / 1 ÷ fraction of background kept',
  'MC': 'Monte Carlo simulation of collisions and the detector',
  'pileup': 'extra proton-proton collisions in the same bunch crossing',
  'seed': 'the random number that sets a model’s initialisation or a generator’s output',
  'early stopping': 'ending training when a held-out score stops improving',
  'bootstrap': 'resampling the test set with replacement to see how much the score moves',
  'truth function': 'the single scoring code that compares predictions with the true labels',
  'CPU / GPU / HPC': 'central / graphics processing unit / high-performance computing',
  'checkpoint': 'a saved copy of a model’s trained weights',
  'hls4ml': 'an open-source tool that turns neural networks into FPGA firmware',
  'synthesis': 'compiling a hardware design for an FPGA; can take hours per model',
  'GNN / Transformer': 'graph neural network / attention-based neural network',
  'RMSE': 'root mean squared error',
};
const TERMS = {
  why: ['AI advantage'],
  claim: ['MLCommons', 'ontology'],
  def: ['HEP', 'FPGA', 'FAIR', 'AUC', 'MLP', 'DOI', 'Pareto front', 'container'],
  constraints: ['L1 trigger', 'MSE', 'technology node'],
  rubric: ['hyperparameters'],
  heatmap: ['AI/ML motif', 'entry'],
  hep: ['LHC / HL-LHC', 'DUNE', 'HDR'],
  question: ['tagger', 'trigger rate', 'signal efficiency / rejection'],
  baselines: ['BDT', 'R²', 'SMAPE', 'AXESS'],
  metrics: ['WP'],
  splits: ['MC', 'pileup', 'seed', 'early stopping'],
  uncert: ['bootstrap'],
  scorer1: ['truth function', 'CPU / GPU / HPC'],
  lessons: ['checkpoint'],
  axess: ['hls4ml', 'synthesis', 'GNN / Transformer', 'RMSE'],
};

S({ id: 'b-credits', part: 9, crumb: 'Credits', title: 'Credits and sources', budget: 0,
