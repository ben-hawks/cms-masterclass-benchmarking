   <li><b>Presentation design and engine</b> adapted from Andrzej Novak's CMS internal masterclass talk on the JFC paper (22 Sep 2026)<small><a href="https://github.com/jfc-mit/jfc-talk" target="_blank" rel="noopener">github.com/jfc-mit/jfc-talk</a> · itself styled after the hcc-kappac Florence talk and <a href="https://www.danielmurnane.com/ETH-Agentic-AI-for-Collider-Physics/" target="_blank" rel="noopener">danielmurnane.com</a> · paper theme, mono crumbs, the part outline and scene/step flow follow that deck</small></li>
   <li><b>Benchmark definition, rubric, Table II data, Figs. 1 and 3</b><small>B. Hawks, G. von Laszewski, M. D. Sinclair, M. Colombo, S. Venkataraman, R. Jain, Y. Jiang, N. Tran, G. Fox, “An MLCommons Scientific Benchmarks Ontology”, <a href="https://arxiv.org/abs/2511.05614" target="_blank" rel="noopener">arXiv:2511.05614</a></small></li>
   <li><b>Part IV examples</b> (AXESS, baselines, one scorer, lessons) adapted from B. Hawks, “Benchmarking-driven model development”, tutorial session, 15 Oct 2026</li>
   <li><b>HEP benchmark names</b> in Part III are taken from the ontology’s source data, <a href="https://github.com/mlcommons-science/benchmark" target="_blank" rel="noopener">mlcommons-science/benchmark</a></li>
   <li><b>Typeface</b> EB Garamond (SIL Open Font License), via Google Fonts</li>
  </ul>`,
  notes: `<p>Backup: credits for the design and the sources of every figure and number.</p>` });

/* ===================================================== engine */
const stage = document.getElementById('stage'), vp = document.getElementById('viewport');
SC.sort((a, b) => (a.part === 9) - (b.part === 9));
const MAIN = SC.filter(s => s.part !== 9);
const BUDGET_TOTAL = MAIN.reduce((a, s) => a + s.budget, 0);
SC.forEach(s => { const d = document.createElement('section'); d.className = 'scene'; d.id = 'sc-' + s.id; d.innerHTML = s.html + (TERMS[s.id] ? `<div class="terms"><span class="tl">terms</span>${TERMS[s.id].map(k => `<span><b>${esc(k)}</b> ${GLOSS[k]}</span>`).join('')}</div>` : '');
  const h = d.querySelector(':scope > h2.k'); if (h && h.nextElementSibling) { const b = document.createElement('div'); b.className = 'body'; while (h.nextSibling) b.appendChild(h.nextSibling); d.appendChild(b); }
  s.el = d; stage.appendChild(d); });
const TALK_DATE = '26 October 2026';
if (TALK_DATE) document.getElementById('talkdate').innerHTML = '<br>' + esc(TALK_DATE);

/* fill computed numbers */
const $ = id => document.getElementById(id);
$('hm-n').textContent = STATS.n; $('hm-hep').textContent = MOT.reduce((s, [m]) => s + (STATS.cells[m + 'H'] || []).length, 0); $('hm-ent').textContent = STATS.entries;
$('rt-end').textContent = STATS.end.length; $('rt-n').textContent = STATS.n; $('rt-hm').textContent = STATS.hepMean.toFixed(2); $('rt-am').textContent = STATS.mean.toFixed(2);
$('rt-word').textContent = ['no', 'one', 'two', 'three'][STATS.hepEnd.length] || STATS.hepEnd.length;
(() => { const rows = [...STATS.hep].sort((a, b) => b[3] - a[3]); const half = Math.ceil(rows.length / 2);
  const tb = part => `<table class="tb" style="font-size:16px"><thead><tr><th>benchmark</th><th>motif</th><th style="width:170px">score</th></tr></thead><tbody>${part.map(t => `<tr><td>${esc(t[4])} ${LHC.has(t[4]) ? '<span class="tag lhc">LHC</span>' : ''}<small>[${t[0]}]${t[1].length > 1 ? ' · multi-domain' : ''}</small></td><td style="font-size:14px;color:var(--ink60)">${motName(t[2])}</td><td><div style="display:flex;align-items:center;gap:8px"><div style="height:8px;border-radius:4px;width:${t[3] / 5 * 90}px;background:${t[3] >= 4.5 ? 'var(--green)' : 'var(--accent)'}"></div><span class="mono" style="font-size:14px">${t[3].toFixed(2)}</span></div></td></tr>`).join('')}</tbody></table>`;
  $('heptab').innerHTML = tb(rows.slice(0, half)) + tb(rows.slice(half)); })();

let cur = 0, step = 1, t0 = null;
function fit() { const w = vp.clientWidth, h = vp.clientHeight, s = Math.min(w / 1600, h / 900); stage.style.transform = `translate(-50%,-50%) scale(${s})`; }
addEventListener('resize', fit); fit();

function partLabel(s) { return s.part >= 1 && s.part <= 4 ? `Part ${['I', 'II', 'III', 'IV'][s.part - 1]} · ${PARTS[s.part][0]}` : s.part === 9 ? 'Backup' : ''; }
function show(i, st, push = true) {
  i = Math.max(0, Math.min(SC.length - 1, i)); const s = SC[i]; st = Math.max(1, Math.min(s.steps, st || 1));
  if (i !== cur || !s.el.classList.contains('on')) { SC.forEach(x => x.el.classList.remove('on')); s.el.classList.add('on'); }
  cur = i; step = st;
  s.el.querySelectorAll('[data-step]').forEach(e => e.classList.toggle('shown', +e.dataset.step <= st));
  const pl = partLabel(s);
  $('crumb').innerHTML = `<span class="a">CMS masterclass</span>${pl ? ' · ' + pl : ''} · ${esc(s.crumb)}`;
  const mi = MAIN.indexOf(s);
  $('counter').textContent = mi >= 0 ? `${mi + 1} / ${MAIN.length}` : 'backup';
  $('progress').style.width = (mi >= 0 ? (mi + st / s.steps) / MAIN.length * 100 : 100) + '%';
  $('stepsind').innerHTML = s.steps > 1 ? Array.from({ length: s.steps }, (_, k) => `<span class="${k < st ? 'on' : ''}"></span>`).join('') : '';
  if (push) { const h = '#' + s.id + (st > 1 ? '.' + st : ''); try { history.replaceState(null, '', h); } catch (e) {} }
  renderHud(); hideTip();
}
function next() { if (t0 === null) t0 = Date.now(); const s = SC[cur]; if (step < s.steps) return show(cur, step + 1); const mi = MAIN.indexOf(s); if (mi >= 0 && mi < MAIN.length - 1) show(SC.indexOf(MAIN[mi + 1]), 1); else if (s.part === 9 && cur < SC.length - 1) show(cur + 1, 1); }
function prev() { const s = SC[cur]; if (step > 1) return show(cur, step - 1); const mi = MAIN.indexOf(s); if (mi > 0) { const p = MAIN[mi - 1]; show(SC.indexOf(p), p.steps); } else if (s.part === 9 && SC[cur - 1].part === 9) show(cur - 1, SC[cur - 1].steps); }
function fromHash() { const h = decodeURIComponent(location.hash.slice(1)); if (!h) return show(0, 1, false); const [id, st] = h.split('.'); const i = SC.findIndex(s => s.id === id); show(i < 0 ? 0 : i, +st || 1, false); }

/* click/tap to advance, except on interactive things */
vp.addEventListener('click', e => { if (e.target.closest('a,button,input,label,select,.hm .c,.dot,.scorer')) return; if (e.clientX < innerWidth * 0.18) prev(); else next(); });
addEventListener('keydown', e => {
  if (e.target.closest && e.target.closest('input,textarea') && !['ArrowRight', 'ArrowLeft'].includes(e.key)) return;
  const k = e.key;
  if (['ArrowRight', ' ', 'PageDown', 'Enter'].includes(k)) { e.preventDefault(); closeOv(); next(); }
  else if (['ArrowLeft', 'PageUp', 'Backspace'].includes(k)) { e.preventDefault(); closeOv(); prev(); }
  else if (k === 'Home') show(0, 1); else if (k === 'End') show(SC.indexOf(MAIN[MAIN.length - 1]), MAIN[MAIN.length - 1].steps);
  else if (k === 'o' || k === 'O') toggleOv(); else if (k === 'Escape') { if (!closeOv()) toggleOv(); }
  else if (k === 'h' || k === 'H') toggleHud(); else if (k === 'd' || k === 'D') cycleTheme();
  else if (k === 'f' || k === 'F') { try { document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen().catch(() => {}); } catch (e2) {} }
  else if (k === '?') toggleHelp(); else if (k === 'r' || k === 'R') { t0 = null; show(0, 1); }
});
addEventListener('hashchange', fromHash);

/* overview */
function closeOv() { let c = false; ['overview', 'help'].forEach(id => { if (!$(id).hidden) { $(id).hidden = true; c = true; } }); return c; }
function toggleOv() {
  const o = $('overview'); if (!o.hidden) return (o.hidden = true);
  const card = s => `<button type="button" class="ovcard ${SC[cur] === s ? 'cur' : ''}" data-go="${SC.indexOf(s)}"><span class="n">${MAIN.includes(s) ? MAIN.indexOf(s) + 1 : 'B'} · <span class="a">${esc(partLabel(s) || 'Opening')}</span></span><span class="ti">${esc(s.title)}</span></button>`;
  o.innerHTML = `<button class="btn ovclose" type="button" data-close>close · esc</button><h3>Overview — <em>${MAIN.length} scenes</em>, ~${Math.round(BUDGET_TOTAL / 60)} min</h3><div class="ovgrid">${MAIN.map(card).join('')}</div><h3 style="margin-top:28px">Backup</h3><div class="ovgrid">${SC.filter(s => s.part === 9).map(card).join('')}</div>`;
  $('help').hidden = true; o.hidden = false;
}
$('overview').addEventListener('click', e => { const b = e.target.closest('[data-go]'); if (b) { $('overview').hidden = true; show(+b.dataset.go, 1); } else if (e.target.closest('[data-close]') || e.target === $('overview')) $('overview').hidden = true; });
function toggleHelp() { const h = $('help'); if (!h.hidden) return (h.hidden = true);
  h.innerHTML = `<button class="btn ovclose" type="button" data-close>close · esc</button><h3>Keys</h3><div class="keys">
   <span><kbd>→</kbd> <kbd>space</kbd> click</span><span>next step · <kbd>←</kbd> or click the left edge goes back</span>
   <span><kbd>Home</kbd> <kbd>End</kbd></span><span>first / last scene</span><span><kbd>O</kbd></span><span>overview of every scene, plus backups</span>
   <span><kbd>H</kbd></span><span>speaker notes, timer and time budget</span><span><kbd>D</kbd></span><span>theme: auto → light → dark</span>
   <span><kbd>F</kbd></span><span>fullscreen</span><span><kbd>R</kbd></span><span>restart and reset the timer</span></div>
   <p class="muted" style="margin-top:18px;font-size:15px">Deep links: add <span class="mono">#ratings</span> or <span class="mono">#def.3</span> to the address.</p>`;
  $('overview').hidden = true; h.hidden = false; }
$('help').addEventListener('click', e => { if (e.target.closest('[data-close]') || e.target === $('help')) $('help').hidden = true; });

/* HUD */
let hudOn = false; try { hudOn = localStorage.getItem('bm-hud') === '1'; } catch (e) {}
function toggleHud() { hudOn = !hudOn; try { localStorage.setItem('bm-hud', hudOn ? '1' : '0'); } catch (e) {} renderHud(); }
const mmss = s => `${Math.floor(s / 60)}:${String(Math.floor(s % 60)).padStart(2, '0')}`;
function renderHud() {
  const h = $('hud'); h.hidden = !hudOn; if (!hudOn) return; const s = SC[cur];
  const mi = MAIN.indexOf(s); const toHere = MAIN.slice(0, Math.max(0, mi + 1)).reduce((a, x) => a + x.budget, 0);
  const el = t0 ? (Date.now() - t0) / 1000 : 0;
  h.innerHTML = `<div class="hh"><span><b>${esc(s.title)}</b> · step ${step}/${s.steps}</span><span>scene ${mmss(s.budget)} · budget to here ${mmss(toHere)} / ${mmss(BUDGET_TOTAL)} · elapsed <span class="${el > toHere ? 'late' : ''}">${t0 ? mmss(el) : 'starts on first advance'}</span></span></div>${s.notes || ''}`;
}
setInterval(() => { if (hudOn) { const hh = $('hud').querySelector('.hh span:last-child'); if (hh) renderHud(); } }, 1000);

/* theme */
const THEMES = ['auto', 'light', 'dark']; let th = 'auto'; try { th = localStorage.getItem('bm-theme') || 'auto'; } catch (e) {}
function applyTheme() { if (th === 'auto') document.documentElement.removeAttribute('data-theme'); else document.documentElement.setAttribute('data-theme', th); $('b-th').textContent = '◐ ' + th; }
function cycleTheme() { th = THEMES[(THEMES.indexOf(th) + 1) % 3]; try { localStorage.setItem('bm-theme', th); } catch (e) {} applyTheme(); }
if (th !== 'auto') applyTheme(); else $('b-th').textContent = '◐ auto';
$('b-th').onclick = cycleTheme; $('b-ov').onclick = toggleOv; $('b-hud').onclick = toggleHud; $('b-help').onclick = toggleHelp;

/* tooltips: heatmap cells and swarm dots */
const tip = $('tip');
function showTip(html, e) { tip.innerHTML = html; tip.classList.add('on'); const r = tip.getBoundingClientRect(); let x = e.clientX + 14, y = e.clientY + 14; if (x + r.width > innerWidth - 8) x = e.clientX - r.width - 14; if (y + r.height > innerHeight - 8) y = e.clientY - r.height - 14; tip.style.left = x + 'px'; tip.style.top = y + 'px'; }
function hideTip() { tip.classList.remove('on'); }
stage.addEventListener('mousemove', e => {
  const c = e.target.closest('.hm .c[data-cell]'), d = e.target.closest('.dot');
  if (c) { const k = c.dataset.cell, a = STATS.cells[k] || [], dn = DOM.find(x => x[0] === k.slice(2))[1];
    const names = [...new Set(a.map(t => t[4]))];
    showTip(`<b>${dn} × ${motName(k.slice(0, 2))}</b><br>${a.length} task${a.length === 1 ? '' : 's'}${names.length ? '<br>' + names.slice(0, 8).map(esc).join('<br>') + (names.length > 8 ? '<br>…' : '') : ''}`, e); }
  else if (d) { const t = T[+d.dataset.t]; showTip(`<b>${esc(t[4])}</b> [${t[0]}]<br>${t[1].split('').map(x => DOM.find(y => y[0] === x)[1]).join(', ')} · ${motName(t[2])}<br>average <b>${t[3].toFixed(2)}</b>${t[3] >= 4.5 ? ' · endorsed' : ''}`, e); }
  else hideTip();
});
stage.addEventListener('mouseleave', hideTip);

/* rubric scorer */
const scorer = $('scorer');
function score() {
  const v = RUBRIC.map((_, ci) => ci === 3 ? (+scorer.querySelector('input[name=mdef]:checked').value + +scorer.querySelector('input[name=mq]:checked').value) : scorer.querySelectorAll(`input[type=checkbox][data-c="${ci}"]:checked`).length);
  v.forEach((x, i) => $('sc' + i).textContent = x);
  const avg = v.reduce((a, b) => a + b, 0) / 6; $('sc-avg').textContent = avg.toFixed(2);
  $('sc-radar').innerHTML = radar(v, 300);
  const ok = avg >= 4.5; const b = $('sc-badge'); b.className = 'badge ' + (ok ? 'ok' : 'no'); b.textContent = ok ? 'endorsement bar ≥ 4.5 ✓' : `below the 4.5 bar (${(4.5 - avg).toFixed(2)} short)`;
}
scorer.addEventListener('change', score);
const PRESETS = {
  clear: { boxes: [], mdef: 0, mq: 0 },
  axess: { boxes: 'all', mdef: 3, mq: 2 },
  paper: { boxes: ['0_0', '1_1', '1_2', '1_3', '1_4', '2_0', '2_1', '2_2', '2_4', '4_0', '5_0', '5_1', '5_2', '5_4'], mdef: 2, mq: 1 },
};
document.querySelectorAll('[data-preset]').forEach(b => b.addEventListener('click', () => { const p = PRESETS[b.dataset.preset];
  scorer.querySelectorAll('input[type=checkbox]').forEach(cb => { cb.checked = p.boxes === 'all' || p.boxes.includes(cb.id.slice(1)); });
  $('mdef' + p.mdef).checked = true; $('mq' + p.mq).checked = true; score(); }));
score();

fromHash();
</script>

</body>
</html>
